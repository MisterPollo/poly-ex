<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 450px;
      max-height: 600px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace, sans-serif;
      background: #111111;
      color: #e5e5e5;
      overflow-y: auto;
    }

    .header {
      background: linear-gradient(135deg, #1a1a1a 0%, #222222 100%);
      padding: 16px;
      border-bottom: 1px solid #2a2a2a;
    }

    .header h2 {
      font-size: 16px;
      font-weight: 600;
      color: #22c55e;
      margin-bottom: 8px;
    }

    .market-info {
      background: #1a1a1a;
      padding: 12px;
      border-radius: 6px;
      font-size: 11px;
      margin-top: 8px;
      border: 1px solid #2a2a2a;
    }

    .market-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .market-row:last-child {
      margin-bottom: 0;
    }

    .market-label {
      color: #888;
    }

    .market-value {
      color: #22c55e;
      font-weight: 600;
      font-family: 'Courier New', monospace;
    }

    .price-up {
      color: #22c55e;
    }

    .price-down {
      color: #22c55e;
    }

    .content {
      padding: 16px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 1px solid #2a2a2a;
    }

    .tab {
      padding: 8px 16px;
      background: transparent;
      border: none;
      color: #888;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .tab:hover {
      color: #e5e5e5;
    }

    .tab.active {
      color: #22c55e;
      border-bottom-color: #22c55e;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .section {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: 500;
      color: #cbd5e1;
    }

    input[type="number"] {
      width: 100%;
      padding: 8px 10px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      color: #e5e5e5;
      font-size: 13px;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
    }

    .range-inputs {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .range-inputs input {
      flex: 1;
    }

    .range-inputs span {
      color: #64748b;
      font-size: 11px;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .checkbox-group input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: #22c55e;
    }

    .checkbox-group label {
      margin: 0;
      cursor: pointer;
      font-weight: normal;
    }

    .sub-settings {
      margin-left: 24px;
      margin-top: 10px;
      padding: 10px;
      background: #1a1a1a;
      border-left: 2px solid #22c55e;
      border-radius: 4px;
    }

    .small-text {
      font-size: 10px;
      color: #64748b;
      margin-top: 4px;
    }

    .control-buttons {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    #startBtn {
      background: #22c55e;
      color: #000;
    }

    #startBtn:hover {
      background: #16a34a;
    }

    #startBtn.running {
      background: #ef4444;
    }

    #startBtn.running:hover {
      background: #dc2626;
    }

    #saveBtn {
      background: #2a2a2a;
      color: #e5e5e5;
    }

    #saveBtn:hover {
      background: #333;
    }

    .status-bar {
      background: #1a1a1a;
      padding: 10px 16px;
      border-top: 1px solid #2a2a2a;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #444;
    }

    .status-indicator.active {
      background: #22c55e;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .status-text {
      flex: 1;
      color: #888;
    }

    /* Console Tab */
    .console {
      background: #0a0a0a;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      height: 300px;
      overflow-y: auto;
      padding: 10px;
      font-family: 'Courier New', monospace;
      font-size: 11px;
    }

    .console-line {
      margin-bottom: 4px;
      padding: 4px;
      border-radius: 3px;
    }

    .console-line.info {
      color: #22c55e;
    }

    .console-line.success {
      color: #22c55e;
    }

    .console-line.warning {
      color: #fbbf24;
    }

    .console-line.error {
      color: #f87171;
    }

    .console-time {
      color: #64748b;
      margin-right: 8px;
    }

    .console-controls {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .console-controls button {
      flex: none;
      padding: 6px 12px;
      font-size: 11px;
      background: #1a1a1a;
      color: #888;
    }

    .console-controls button:hover {
      background: #2a2a2a;
      color: #e5e5e5;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #1a1a1a;
    }

    ::-webkit-scrollbar-thumb {
      background: #2a2a2a;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>⚡ Gvagva Lecsó</h2>

    <div class="market-info">
      <div class="market-row">
        <span class="market-label">Market:</span>
        <span class="market-value" id="marketSlug">Loading...</span>
      </div>
      <div class="market-row">
        <span class="market-label">Time Remaining:</span>
        <span class="market-value" id="timeRemaining">--:--</span>
      </div>
      <div class="market-row">
        <span class="market-label">UP:</span>
        <span class="market-value price-up" id="upPrice">--%</span>
      </div>
      <div class="market-row">
        <span class="market-label">DOWN:</span>
        <span class="market-value price-down" id="downPrice">--%</span>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="tabs">
      <button class="tab active" data-tab="settings">Settings</button>
      <button class="tab" data-tab="console">Console</button>
    </div>

    <!-- Settings Tab -->
    <div class="tab-content active" id="settings-tab">
      <div class="section">
        <label>Stake per Trade (USD)</label>
        <input type="number" id="stake" min="0.1" step="0.1" value="1.0">
        <div class="small-text">Minimum: $0.1</div>
      </div>

      <div class="section">
        <label>Entry Probability Range</label>
        <div class="range-inputs">
          <input type="number" id="probMin" min="0.5" max="0.99" step="0.01" value="0.70">
          <span>to</span>
          <input type="number" id="probMax" min="0.5" max="0.99" step="0.01" value="0.78">
        </div>
        <div class="small-text">Enter when UP or DOWN hits this range</div>
      </div>

      <div class="section">
        <label>Entry Time Window (seconds)</label>
        <div class="range-inputs">
          <input type="number" id="timeMin" min="0" max="300" step="1" value="180">
          <span>to</span>
          <input type="number" id="timeMax" min="0" max="300" step="1" value="300">
        </div>
        <div class="small-text">Trade between these seconds in the 5-min market</div>
      </div>

      <div class="section">
        <div class="checkbox-group">
          <input type="checkbox" id="scalingEnabled">
          <label for="scalingEnabled">Enable Scaling</label>
        </div>
        <div id="scalingSettings" class="sub-settings" style="display: none;">
          <label>Scale at probability</label>
          <input type="number" id="scaleProb" min="0.5" max="0.99" step="0.01" value="0.80">
          <label style="margin-top: 8px;">Additional stake</label>
          <input type="number" id="scaleStake" min="0.1" step="0.1" value="5.0">
        </div>
      </div>

      <div class="section">
        <div class="checkbox-group">
          <input type="checkbox" id="martingaleEnabled">
          <label for="martingaleEnabled">Enable Martingale</label>
        </div>
        <div id="martingaleSettings" class="sub-settings" style="display: none;">
          <label>Multiplier after loss</label>
          <input type="number" id="martingaleMultiplier" min="1.5" max="5" step="0.1" value="2.0">
          <label style="margin-top: 8px;">Max consecutive losses</label>
          <input type="number" id="martingaleMaxSteps" min="1" max="10" step="1" value="3">
        </div>
      </div>

      <div class="control-buttons">
        <button id="saveBtn">Save Settings</button>
        <button id="startBtn">Start Bot</button>
      </div>

      <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #2a2a2a;">
        <button id="toggleFloatingPanelBtn" style="width: 100%; padding: 8px; background: #2a2a2a; color: #e5e5e5; border: none; border-radius: 6px; font-size: 12px; cursor: pointer;">Show Floating Panel</button>
      </div>
    </div>

    <!-- Console Tab -->
    <div class="tab-content" id="console-tab">
      <div class="console-controls">
        <button id="clearConsoleBtn">Clear</button>
        <button id="exportLogsBtn">Export</button>
      </div>
      <div class="console" id="console"></div>
    </div>
  </div>

  <div class="status-bar">
    <div class="status-indicator" id="statusIndicator"></div>
    <div class="status-text" id="statusText">Bot is idle</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
